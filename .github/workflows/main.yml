name: Bot de Promocoes

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

# Permite que o workflow commite as alterações de volta no repositório
permissions:
  contents: write

jobs:
  rodar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Garante que a chave de autenticação seja mantida

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar as dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Script do Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          GOOGLE_SHEETS_CSV_URL: ${{ secrets.GOOGLE_SHEETS_CSV_URL }}
        run: python bot.py

      # SALVA O HISTÓRICO DE PREÇOS E O SITE ESTÁTICO DE OFERTAS
      - name: Commitar historico e site
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add historico_precos.json index.html
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada para commitar."
          else
            git commit -m "🤖 Bot: Atualização do histórico e portal de ofertas [skip ci]"
            git push origin main
          fi
