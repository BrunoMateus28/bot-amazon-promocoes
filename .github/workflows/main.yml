name: Bot de Promocoes

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

# Permite que o workflow commite as alterações de volta no repositório
permissions:
  contents: write

jobs:
  rodar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Garante que a chave de autenticação seja mantida

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar as dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Script do Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python bot.py

      # SALVA O HISTÓRICO DE VOLTA NO REPOSITÓRIO
      - name: Commitar alteracoes de historico
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Verifica se o arquivo de histórico foi criado ou modificado
          if git status --porcelain | grep -E "historico_precos.json"; then
            git add historico_precos.json
            git commit -m "🤖 Bot: Atualização automática do histórico de preços [skip ci]"
            git push origin main
          else
            echo "Nenhuma alteração no histórico para commitar."
          fi